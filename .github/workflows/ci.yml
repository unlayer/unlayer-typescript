name: CI
on:
  push:
  pull_request:

jobs:
  verify:
    timeout-minutes: 10
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Verify SDK package
        run: yarn test
